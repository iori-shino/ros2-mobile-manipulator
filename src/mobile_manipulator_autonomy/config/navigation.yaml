bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.3
    default_server_timeout: 200
    bt_loop_duration: 50

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    odom_topic: /odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.002
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.06
      movement_time_allowance: 18.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.05
      lookahead_dist: 0.22
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      use_velocity_scaled_lookahead_dist: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.4
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.28
      regulated_linear_scaling_min_speed: 0.02
      approach_velocity_scaling_dist: 0.12
      min_approach_linear_velocity: 0.018
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.45
      rotate_to_heading_angular_vel: 0.36
      max_angular_accel: 0.6
      transform_tolerance: 0.3
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.20, 0.19], [0.20, -0.19], [-0.20, -0.19], [-0.20, 0.19]]"
      footprint_padding: 0.015
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.35
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          max_obstacle_height: 0.7
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.20, 0.19], [0.20, -0.19], [-0.20, -0.19], [-0.20, 0.19]]"
      footprint_padding: 0.015
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.35
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          max_obstacle_height: 0.7
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 5.0

behavior_server:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    max_rotational_vel: 0.4
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.6
